name: Backend tests

on:
  push:
    paths: ['api/**', 'server/**', 'admin/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['api/**', 'server/**', 'admin/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-mbstring
      - name: PHP syntax check
        run: find api server -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php server/tests/unit.php
      - name: API flow tests
        run: node --test server/tests/flow.test.mjs

name: Deploy to Hostinger

# Manual for now: run it from the Actions tab once the secrets below exist.
# (Switch to `on: push: branches: [main]` when you're happy with it.)
on:
  workflow_dispatch:
    inputs:
      include_content:
        description: "Also upload the files the admin panel owns (data files, article pages, feed, sitemap). Leave OFF — turning it on overwrites what was published from the admin."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-gd php-xml
      - name: PHP syntax check
        run: find api server -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php server/tests/unit.php
      - name: API, round-trip and content tests
        run: node --test server/tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        env:
          INCLUDE_CONTENT: ${{ inputs.include_content }}
        run: |
          EXTRA=()
          if [ "$INCLUDE_CONTENT" != "true" ]; then
            # These are written by the admin panel's Publish button on the server.
            for f in config products runs packages testimonials ar posts images gallery; do EXTRA+=(--exclude "/data/$f.js"); done
            # Article pages, the feed, the sitemap and uploaded photos are written by the admin panel too.
            EXTRA+=(--include '/journal/index.html' --exclude '/journal/*.html' --exclude '/feed.xml' --exclude '/sitemap.xml')
          fi
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '_site' \
            --exclude 'README.md' --exclude 'serve.py' --exclude '*.exe' --exclude '.gitignore' \
            --exclude '__pycache__' --exclude 'node_modules' --exclude 'tools' --exclude 'docs' \
            --exclude '.nojekyll' --exclude 'server/dev' --exclude 'server/tests' \
            --exclude 'server/config.php' --exclude 'server/storage/*' \
            "${EXTRA[@]}"
          mkdir -p _site/server/storage

      # Checks the six secrets before anything is uploaded. It prints each one's LENGTH (never its
      # value) and stops with a clear message naming the bad one. Stray spaces/line breaks pasted
      # into a secret are trimmed away automatically.
      - name: Check the deploy settings
        env:
          S_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          S_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          S_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          S_DIR: ${{ secrets.HOSTINGER_SITE_DIR }}
          S_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          S_KNOWN: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          fail=0
          check() { # name value regex hint
            if [ -z "$2" ]; then echo "::error::$1 is empty or missing. $4"; fail=1
            elif ! printf '%s' "$2" | grep -Eq "$3"; then echo "::error::$1 has the wrong format ($(printf '%s' "$2" | wc -c) characters). $4"; fail=1
            else echo "ok  $1 ($(printf '%s' "$2" | wc -c) characters)"; fi
          }
          HOST=$(trim "$S_HOST"); PORT=$(trim "$S_PORT"); USER_=$(trim "$S_USER"); DIR=$(trim "$S_DIR")
          check HOSTINGER_SSH_HOST "$HOST" '^[A-Za-z0-9.-]+$' "Expected the server IP, e.g. 82.25.126.244"
          check HOSTINGER_SSH_PORT "$PORT" '^[0-9]{2,5}$' "Expected digits only, e.g. 65002"
          check HOSTINGER_SSH_USER "$USER_" '^[A-Za-z0-9_.-]+$' "Expected the SSH username, e.g. u123456789"
          check HOSTINGER_SITE_DIR "$DIR" '^/[A-Za-z0-9_./-]+$' "Expected an absolute path starting with /"
          case "$S_KEY" in *"BEGIN OPENSSH PRIVATE KEY"*"END OPENSSH PRIVATE KEY"*) echo "ok  HOSTINGER_SSH_KEY looks like a private key ($(printf '%s' "$S_KEY" | wc -l) lines)";; *) echo "::error::HOSTINGER_SSH_KEY is missing the BEGIN/END OPENSSH PRIVATE KEY lines"; fail=1;; esac
          case "$S_KNOWN" in *ssh-ed25519*) echo "ok  HOSTINGER_SSH_KNOWN_HOSTS contains an ed25519 key";; *) echo "::error::HOSTINGER_SSH_KNOWN_HOSTS must be the one-line [host]:port ssh-ed25519 AAAA… fingerprint"; fail=1;; esac
          [ "$fail" = 0 ] || exit 1

          # Hand the cleaned values to the next steps.
          { echo "DEPLOY_HOST=$HOST"; echo "DEPLOY_PORT=$PORT"; echo "DEPLOY_USER=$USER_"; echo "DEPLOY_DIR=$DIR"; } >> "$GITHUB_ENV"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$S_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$S_KNOWN" | tr -d '\r' > ~/.ssh/known_hosts
          echo "Key fingerprint (compare with 'ssh-keygen -lf ~/.ssh/sotr-actions.pub' on your PC):"
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "::error::The private key could not be read. Re-copy it into HOSTINGER_SSH_KEY."; exit 1; }

      - name: Test the connection
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" 'echo "connected as $(whoami)"; which rsync'

      # No --delete: a deploy only ever adds or updates files, so it can never wipe uploads or
      # anything the admin panel wrote. --checksum compares content, not timestamps.
      # Photos are special: the owner can replace one from the admin, so a deploy only ADDS photos
      # that aren't on the server yet (--ignore-existing) and never overwrites one.
      - name: Upload
        run: |
          SSH="ssh -p $DEPLOY_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          rsync -rlt --checksum --omit-dir-times --no-perms --stats --exclude '/public/images/'             -e "$SSH" _site/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"
          rsync -rlt --ignore-existing --omit-dir-times --no-perms --stats             -e "$SSH" _site/public/images/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/public/images/"
